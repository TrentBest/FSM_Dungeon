name: Pages

on:
  push:
    branches: [development]
    paths:
      - "src/**"
      - "samples/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate the deterministic dungeon from the C# domain
        run: dotnet run --project samples/Dungeon.Proof/Dungeon.Proof.csproj --configuration Release -- docs/data/dungeon.json

      - name: Verify generated proof data and exploration surfaces
        run: |
          test -s docs/data/dungeon.json
          test -s docs/data/worlds.json
          test -s docs/data/spatial.json
          test -s docs/data/hydraulic.json
          test -s docs/data/geology.json
          test -s docs/data/scenario-replay.json
          test -s docs/index.html
          test -s docs/capability-atlas.html
          grep -F 'Lantern Vault objective replay' docs/index.html
          grep -F 'FSM_Dungeon capability atlas' docs/capability-atlas.html
          touch docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: TrentBest/TheSingularityWorkshop.CiAi/.github/workflows/deploy-pages.yml@5083c452b555d7645dd0c8ab01d76008026da436
