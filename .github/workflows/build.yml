name: Build

on:
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "FSM_Dungeon.sln"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout MicroBundleDomain development dependency
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: _dependencies/MicroBundleDomain
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and pack MicroBundleDomain development dependency
        run: |
          dotnet restore _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj
          dotnet build _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj --configuration Release --no-restore
          mkdir -p _dependencies/nuget
          dotnet pack _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj --configuration Release --no-build --output _dependencies/nuget
      - name: Restore
        run: dotnet restore FSM_Dungeon.sln --source "$GITHUB_WORKSPACE/_dependencies/nuget" --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build FSM_Dungeon.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FSM_Dungeon.sln --configuration Release --no-build --logger "trx;LogFileName=dungeon-tests.trx"
