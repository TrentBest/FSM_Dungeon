name: Build

on:
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "tests/**"
      - "FSM_Dungeon.sln"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore FSM_Dungeon.sln
      - name: Build
        run: dotnet build FSM_Dungeon.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FSM_Dungeon.sln --configuration Release --no-build --logger "trx;LogFileName=dungeon-tests.trx"
